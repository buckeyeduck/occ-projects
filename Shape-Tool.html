<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shape & Symbol Toolkit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; height: 100vh; display: flex; }

  /* Sidebar */
  #sidebar {
    width: 220px;
    background: #16213e;
    border-right: 2px solid #0f3460;
    padding: 10px;
    overflow-y: auto;
    flex-shrink: 0;
    user-select: none;
  }
  #sidebar h2 { font-size: 14px; color: #e94560; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
  #sidebar h2:first-child { margin-top: 4px; }

  .palette {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 4px;
  }
  .palette-item {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f3460;
    border: 1px solid #1a1a5e;
    border-radius: 6px;
    cursor: grab;
    font-size: 26px;
    transition: background 0.15s, transform 0.1s;
  }
  .palette-item:hover { background: #1a4a8a; transform: scale(1.1); }
  .palette-item svg { width: 30px; height: 30px; }

  /* Canvas */
  #canvas {
    flex: 1;
    position: relative;
    background: #fff;
    background-image:
      linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    overflow: hidden;
  }

  .shape {
    position: absolute;
    cursor: grab;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .shape:hover { outline: 2px dashed #e94560; outline-offset: 2px; }
  .shape.selected { outline: 2px solid #e94560; outline-offset: 2px; }
  .shape.dragging { cursor: grabbing; opacity: 0.85; z-index: 9999; }

  /* Resize handle */
  .resize-handle {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 10px;
    height: 10px;
    background: #e94560;
    border-radius: 2px;
    cursor: nwse-resize;
    display: none;
  }
  .shape.selected .resize-handle { display: block; }

  /* Toolbar */
  #toolbar {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 100;
  }
  #toolbar button {
    padding: 8px 14px;
    background: #16213e;
    color: #eee;
    border: 1px solid #0f3460;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #toolbar button:hover { background: #e94560; }

  /* Color picker bar */
  #colorbar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    background: rgba(22,33,62,0.9);
    padding: 8px 14px;
    border-radius: 10px;
    z-index: 100;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .color-swatch:hover, .color-swatch.active { transform: scale(1.2); border-color: #fff; }

  /* Text label input */
  #text-input-overlay {
    display: none;
    position: absolute;
    z-index: 10000;
  }
  #text-input-overlay input {
    font-size: 18px;
    padding: 4px 8px;
    border: 2px solid #e94560;
    border-radius: 4px;
    outline: none;
    min-width: 120px;
  }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Shapes</h2>
  <div class="palette" id="shapes-palette"></div>

  <h2>Arrows & Lines</h2>
  <div class="palette" id="arrows-palette"></div>

  <h2>Icons</h2>
  <div class="palette" id="icons-palette"></div>

  <h2>Dots & Bullets</h2>
  <div class="palette" id="dots-palette"></div>

  <h2>Brackets & Frames</h2>
  <div class="palette" id="brackets-palette"></div>

  <h2>Labels</h2>
  <div class="palette" id="labels-palette"></div>

  <h2>Layout</h2>
  <div class="palette" id="layout-palette"></div>
</div>

<div id="canvas">
  <div id="toolbar">
    <button onclick="clearCanvas()" title="Clear all">Clear All</button>
    <button onclick="deleteSelected()" title="Delete selected">Delete</button>
    <button onclick="duplicateSelected()" title="Duplicate selected">Duplicate</button>
    <button onclick="addTextLabel()" title="Add text label">+ Text</button>
  </div>

  <div id="colorbar"></div>
  <div id="text-input-overlay"><input type="text" id="text-input" placeholder="Type label..."></div>
</div>

<script>
// --- DATA ---
const shapesSVG = [
  { name: 'Square', svg: `<svg viewBox="0 0 30 30"><rect x="2" y="2" width="26" height="26" fill="currentColor" rx="2"/></svg>` },
  { name: 'Rect', svg: `<svg viewBox="0 0 40 24"><rect x="2" y="2" width="36" height="20" fill="currentColor" rx="2"/></svg>` },
  { name: 'Circle', svg: `<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="currentColor"/></svg>` },
  { name: 'Oval', svg: `<svg viewBox="0 0 40 24"><ellipse cx="20" cy="12" rx="18" ry="10" fill="currentColor"/></svg>` },
  { name: 'Triangle', svg: `<svg viewBox="0 0 30 30"><polygon points="15,2 28,28 2,28" fill="currentColor"/></svg>` },
  { name: 'Diamond', svg: `<svg viewBox="0 0 30 30"><polygon points="15,2 28,15 15,28 2,15" fill="currentColor"/></svg>` },
  { name: 'Pentagon', svg: `<svg viewBox="0 0 30 30"><polygon points="15,2 28,11 23,27 7,27 2,11" fill="currentColor"/></svg>` },
  { name: 'Hexagon', svg: `<svg viewBox="0 0 30 30"><polygon points="8,2 22,2 29,15 22,28 8,28 1,15" fill="currentColor"/></svg>` },
  { name: 'Star', svg: `<svg viewBox="0 0 30 30"><polygon points="15,2 18,11 28,11 20,17 23,27 15,21 7,27 10,17 2,11 12,11" fill="currentColor"/></svg>` },
  { name: 'Sq Outline', svg: `<svg viewBox="0 0 30 30"><rect x="3" y="3" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" rx="2"/></svg>` },
  { name: 'Circle Outline', svg: `<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="currentColor" stroke-width="2"/></svg>` },
  { name: 'Rounded Rect', svg: `<svg viewBox="0 0 40 24"><rect x="2" y="2" width="36" height="20" fill="currentColor" rx="10"/></svg>` },
];

const arrows = [
  '→', '←', '↑', '↓', '↔', '↕', '↗', '↘', '↙', '↖',
  '⟶', '⟵', '➜', '➤', '▶', '◀', '▲', '▼',
  '⤴', '⤵', '↩', '↪', '⟳', '⟲',
];

const icons = [
  '✓', '✗', '✕', '⚡', '⚙', '🔒', '🔓', '👤', '👥',
  '📁', '📄', '💬', '🔔', '🔍', '⭐', '❤', '⚠', '❓',
  '📊', '📈', '🖼', '🎯', '💡', '🏠',
  '☰', '⋮', '⊕', '⊖', '⊗',
];

const dots = [
  '●', '○', '◉', '◎', '◆', '◇', '■', '□',
  '▪', '▫', '•', '◦', '⬤', '⬡', '⬢',
  '①', '②', '③', '④', '⑤',
];

const brackets = [
  '「', '」', '『', '』', '【', '】',
  '〈', '〉', '《', '》', '⌜', '⌝', '⌞', '⌟',
  '╔', '╗', '╚', '╝', '═', '║',
];

const labels = [
  { text: 'Header', style: 'font-weight:bold;font-size:24px;color:#333' },
  { text: 'Subheader', style: 'font-weight:bold;font-size:18px;color:#555' },
  { text: 'Body Text', style: 'font-size:14px;color:#333' },
  { text: 'Label', style: 'font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px' },
  { text: 'Button', style: 'font-size:14px;color:#fff;background:#0f3460;padding:6px 16px;border-radius:6px' },
  { text: 'Link', style: 'font-size:14px;color:#2196F3;text-decoration:underline' },
];

const layoutItems = [
  { name: 'Horiz Line', svg: `<svg viewBox="0 0 120 4" width="120" height="4"><line x1="0" y1="2" x2="120" y2="2" stroke="currentColor" stroke-width="2"/></svg>` },
  { name: 'Vert Line', svg: `<svg viewBox="0 0 4 120" width="4" height="120"><line x1="2" y1="0" x2="2" y2="120" stroke="currentColor" stroke-width="2"/></svg>` },
  { name: 'Dashed H', svg: `<svg viewBox="0 0 120 4" width="120" height="4"><line x1="0" y1="2" x2="120" y2="2" stroke="currentColor" stroke-width="2" stroke-dasharray="8,4"/></svg>` },
  { name: 'Box 200x150', svg: `<svg viewBox="0 0 200 150" width="200" height="150"><rect x="1" y="1" width="198" height="148" fill="none" stroke="currentColor" stroke-width="2" rx="4"/></svg>` },
  { name: 'Box 300x50', svg: `<svg viewBox="0 0 300 50" width="300" height="50"><rect x="1" y="1" width="298" height="48" fill="none" stroke="currentColor" stroke-width="2" rx="4"/></svg>` },
  { name: 'Card', svg: `<svg viewBox="0 0 200 120" width="200" height="120"><rect x="1" y="1" width="198" height="118" fill="rgba(0,0,0,0.03)" stroke="currentColor" stroke-width="1.5" rx="8"/><line x1="1" y1="36" x2="199" y2="36" stroke="currentColor" stroke-width="1"/></svg>` },
];

const colors = ['#333333','#e94560','#0f3460','#2196F3','#4CAF50','#FF9800','#9C27B0','#00BCD4','#795548','#607D8B','#FFFFFF','#F5F5F5'];
let currentColor = '#333333';

// --- BUILD SIDEBAR ---
function buildPalette(id, items, type) {
  const el = document.getElementById(id);
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'palette-item';
    div.draggable = false;
    if (type === 'svg') {
      div.innerHTML = item.svg;
      div.style.color = '#ccc';
      div.title = item.name;
      div.addEventListener('mousedown', (e) => startDragNew(e, 'svg', item));
    } else if (type === 'char') {
      div.textContent = item;
      div.title = item;
      div.addEventListener('mousedown', (e) => startDragNew(e, 'char', item));
    } else if (type === 'label') {
      div.textContent = 'Aa';
      div.title = item.text;
      div.style.fontSize = '16px';
      div.addEventListener('mousedown', (e) => startDragNew(e, 'label', item));
    } else if (type === 'layout') {
      div.innerHTML = item.svg;
      div.style.color = '#aaa';
      div.style.width = '92px';
      div.title = item.name;
      div.addEventListener('mousedown', (e) => startDragNew(e, 'layout', item));
    }
  });
  // Append after building
  items.forEach((item, i) => {
    // Already appended via event listeners? No, let me fix:
  });
  // Rebuild properly
  el.innerHTML = '';
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'palette-item';
    if (type === 'svg') {
      div.innerHTML = item.svg;
      div.style.color = '#ccc';
      div.title = item.name;
      div.addEventListener('mousedown', (e) => startDragNew(e, 'svg', item));
    } else if (type === 'char') {
      div.textContent = item;
      div.title = item;
      div.addEventListener('mousedown', (e) => startDragNew(e, 'char', item));
    } else if (type === 'label') {
      div.textContent = 'Aa';
      div.title = item.text;
      div.style.fontSize = '16px';
      div.addEventListener('mousedown', (e) => startDragNew(e, 'label', item));
    } else if (type === 'layout') {
      div.innerHTML = item.svg;
      div.style.color = '#aaa';
      div.style.width = '92px';
      div.title = item.name;
      div.addEventListener('mousedown', (e) => startDragNew(e, 'layout', item));
    }
    el.appendChild(div);
  });
}

buildPalette('shapes-palette', shapesSVG, 'svg');
buildPalette('arrows-palette', arrows, 'char');
buildPalette('icons-palette', icons, 'char');
buildPalette('dots-palette', dots, 'char');
buildPalette('brackets-palette', brackets, 'char');
buildPalette('labels-palette', labels, 'label');
buildPalette('layout-palette', layoutItems, 'layout');

// Color bar
const colorbar = document.getElementById('colorbar');
colors.forEach(c => {
  const s = document.createElement('div');
  s.className = 'color-swatch' + (c === currentColor ? ' active' : '');
  s.style.background = c;
  if (c === '#FFFFFF' || c === '#F5F5F5') s.style.border = '2px solid #999';
  s.addEventListener('click', () => {
    currentColor = c;
    document.querySelectorAll('.color-swatch').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    if (selectedShape) {
      selectedShape.style.color = c;
      const svgs = selectedShape.querySelectorAll('svg');
      svgs.forEach(sv => sv.style.color = c);
    }
  });
  colorbar.appendChild(s);
});

// --- CANVAS LOGIC ---
const canvas = document.getElementById('canvas');
let selectedShape = null;
let shapeIdCounter = 0;

function createShapeOnCanvas(type, data, x, y) {
  const el = document.createElement('div');
  el.className = 'shape';
  el.id = 'shape-' + (shapeIdCounter++);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = currentColor;

  if (type === 'svg' || type === 'layout') {
    el.innerHTML = data.svg;
    const svg = el.querySelector('svg');
    svg.style.color = 'inherit';
    svg.style.pointerEvents = 'none';
    if (type === 'svg') {
      el.style.width = '60px';
      el.style.height = '60px';
      svg.style.width = '100%';
      svg.style.height = '100%';
    }
  } else if (type === 'char') {
    el.textContent = data;
    el.style.fontSize = '36px';
    el.style.lineHeight = '1';
  } else if (type === 'label') {
    el.textContent = data.text;
    el.style.cssText += data.style;
    el.style.position = 'absolute';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.cursor = 'grab';
    el.style.whiteSpace = 'nowrap';
  }

  // Resize handle for SVG shapes
  if (type === 'svg' || type === 'layout') {
    const rh = document.createElement('div');
    rh.className = 'resize-handle';
    rh.addEventListener('mousedown', (e) => startResize(e, el));
    el.appendChild(rh);
  }

  // Double-click to edit text
  el.addEventListener('dblclick', () => {
    if (type === 'label' || type === 'char') {
      const input = prompt('Edit text:', el.textContent);
      if (input !== null) el.textContent = input;
    }
  });

  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('resize-handle')) return;
    selectShape(el);
    startDragExisting(e, el);
  });

  canvas.appendChild(el);
  selectShape(el);
  return el;
}

function selectShape(el) {
  if (selectedShape) selectedShape.classList.remove('selected');
  selectedShape = el;
  if (el) el.classList.add('selected');
}

// --- DRAG NEW FROM PALETTE ---
function startDragNew(e, type, data) {
  e.preventDefault();
  const canvasRect = canvas.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.style.position = 'fixed';
  ghost.style.pointerEvents = 'none';
  ghost.style.zIndex = '99999';
  ghost.style.opacity = '0.7';
  ghost.style.fontSize = '36px';
  if (type === 'svg' || type === 'layout') {
    ghost.innerHTML = data.svg || data;
    ghost.style.color = currentColor;
  } else if (type === 'char') {
    ghost.textContent = data;
    ghost.style.color = currentColor;
  } else if (type === 'label') {
    ghost.textContent = data.text;
    ghost.style.cssText = data.style + ';position:fixed;pointer-events:none;z-index:99999;opacity:0.7;';
  }
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
  document.body.appendChild(ghost);

  function onMove(ev) {
    ghost.style.left = ev.clientX + 'px';
    ghost.style.top = ev.clientY + 'px';
  }
  function onUp(ev) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.removeChild(ghost);
    const rx = ev.clientX - canvasRect.left;
    const ry = ev.clientY - canvasRect.top;
    if (rx > 0 && ry > 0 && rx < canvasRect.width && ry < canvasRect.height) {
      createShapeOnCanvas(type, data, rx - 20, ry - 20);
    }
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// --- DRAG EXISTING ON CANVAS ---
function startDragExisting(e, el) {
  e.preventDefault();
  el.classList.add('dragging');
  const startX = e.clientX - el.offsetLeft;
  const startY = e.clientY - el.offsetTop;

  function onMove(ev) {
    el.style.left = (ev.clientX - startX) + 'px';
    el.style.top = (ev.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    el.classList.remove('dragging');
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// --- RESIZE ---
function startResize(e, el) {
  e.preventDefault();
  e.stopPropagation();
  const startX = e.clientX;
  const startY = e.clientY;
  const startW = el.offsetWidth;
  const startH = el.offsetHeight;

  function onMove(ev) {
    el.style.width = Math.max(20, startW + ev.clientX - startX) + 'px';
    el.style.height = Math.max(20, startH + ev.clientY - startY) + 'px';
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// --- TOOLBAR ---
function clearCanvas() {
  if (confirm('Clear all shapes?')) {
    canvas.querySelectorAll('.shape').forEach(s => s.remove());
    selectedShape = null;
  }
}

function deleteSelected() {
  if (selectedShape) {
    selectedShape.remove();
    selectedShape = null;
  }
}

function duplicateSelected() {
  if (!selectedShape) return;
  const clone = selectedShape.cloneNode(true);
  clone.id = 'shape-' + (shapeIdCounter++);
  clone.style.left = (selectedShape.offsetLeft + 20) + 'px';
  clone.style.top = (selectedShape.offsetTop + 20) + 'px';
  clone.classList.remove('selected');

  // Re-attach events
  clone.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('resize-handle')) return;
    selectShape(clone);
    startDragExisting(e, clone);
  });
  clone.addEventListener('dblclick', () => {
    const input = prompt('Edit text:', clone.textContent);
    if (input !== null) clone.textContent = input;
  });
  const rh = clone.querySelector('.resize-handle');
  if (rh) rh.addEventListener('mousedown', (e) => startResize(e, clone));

  canvas.appendChild(clone);
  selectShape(clone);
}

function addTextLabel() {
  const text = prompt('Enter text:');
  if (text) {
    createShapeOnCanvas('label', { text, style: 'font-size:16px;color:' + currentColor }, 200, 200);
  }
}

// Deselect on canvas click
canvas.addEventListener('mousedown', (e) => {
  if (e.target === canvas) selectShape(null);
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedShape && document.activeElement.tagName !== 'INPUT') {
      deleteSelected();
    }
  }
  if (e.key === 'd' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    duplicateSelected();
  }
});
</script>
</body>
</html>
