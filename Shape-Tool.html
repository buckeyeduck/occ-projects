<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Copy & Paste Shape Kit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #1e1e2e;
    color: #eee;
    padding: 16px;
    min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 4px; color: #f5c542; }
  .subtitle { font-size: 13px; color: #aaa; margin-bottom: 16px; }
  h2 {
    font-size: 13px;
    color: #f06;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 18px 0 8px;
    border-bottom: 1px solid #333;
    padding-bottom: 4px;
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 70px;
    min-height: 70px;
    background: #2a2a3e;
    border: 1px solid #444;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    padding: 6px 4px;
    position: relative;
  }
  .btn:hover { background: #3a3a5e; border-color: #888; transform: scale(1.05); }
  .btn:active { background: #4a4a6e; transform: scale(0.97); }
  .btn .icon { font-size: 28px; line-height: 1; }
  .btn .lbl { font-size: 9px; color: #999; margin-top: 4px; text-align: center; word-break: break-word; }
  .btn svg { width: 36px; height: 36px; }

  /* Wide buttons for layout items */
  .btn.wide { width: 110px; }
  .btn.wide svg { width: 80px; height: 30px; }

  /* Copied flash */
  .btn.copied { background: #2e7d32 !important; border-color: #4caf50 !important; }
  .btn.copied::after {
    content: 'COPIED!';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #4caf50;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 4px;
    pointer-events: none;
  }

  /* Size picker */
  .size-bar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 10px 0;
    background: #2a2a3e;
    padding: 8px 14px;
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .size-bar label { font-size: 12px; color: #ccc; }
  .size-bar input[type=range] { width: 120px; }
  .size-bar .val { font-size: 12px; color: #f5c542; min-width: 40px; }
  .size-bar select, .size-bar input[type=color] {
    background: #1e1e2e;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

<h1>Copy & Paste Shape Kit</h1>
<p class="subtitle">Click any button to copy its HTML to your clipboard. Then Ctrl+V into your HTML file.</p>

<div class="size-bar">
  <label>Size:</label>
  <input type="range" id="sizeSlider" min="10" max="200" value="40">
  <span class="val" id="sizeVal">40px</span>

  <label>Color:</label>
  <input type="color" id="colorPicker" value="#333333">

  <label>BG:</label>
  <select id="bgPicker">
    <option value="transparent">None</option>
    <option value="#ffffff">White</option>
    <option value="#f0f0f0">Light Gray</option>
    <option value="#333333">Dark</option>
    <option value="#ff0000">Red</option>
    <option value="#0066ff">Blue</option>
    <option value="#00aa00">Green</option>
    <option value="#ff9900">Orange</option>
    <option value="#9900cc">Purple</option>
  </select>

  <label>Position:</label>
  <select id="posPicker">
    <option value="inline">Inline (flows with text)</option>
    <option value="absolute">Absolute (place anywhere)</option>
  </select>
</div>

<!-- SHAPES -->
<h2>Shapes (filled)</h2>
<div class="grid" id="shapes-filled"></div>

<h2>Shapes (outline)</h2>
<div class="grid" id="shapes-outline"></div>

<h2>Arrows & Lines</h2>
<div class="grid" id="arrows"></div>

<h2>Icons & Symbols</h2>
<div class="grid" id="icons"></div>

<h2>Dots & Bullets</h2>
<div class="grid" id="dots"></div>

<h2>Numbers</h2>
<div class="grid" id="numbers"></div>

<h2>Brackets & Borders</h2>
<div class="grid" id="brackets"></div>

<h2>Layout Pieces</h2>
<div class="grid" id="layout"></div>

<h2>Common HTML Blocks</h2>
<div class="grid" id="blocks"></div>

<script>
// --- Helpers ---
function getSize() { return document.getElementById('sizeSlider').value; }
function getColor() { return document.getElementById('colorPicker').value; }
function getBg() { return document.getElementById('bgPicker').value; }
function getPos() { return document.getElementById('posPicker').value; }

document.getElementById('sizeSlider').addEventListener('input', function() {
  document.getElementById('sizeVal').textContent = this.value + 'px';
});

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    setTimeout(() => btn.classList.remove('copied'), 600);
  });
}

function makeStyle() {
  const s = getSize();
  const c = getColor();
  const bg = getBg();
  const pos = getPos();
  let style = `font-size:${s}px; color:${c};`;
  if (bg !== 'transparent') style += ` background:${bg}; padding:4px; border-radius:4px;`;
  if (pos === 'absolute') style += ` position:absolute; left:100px; top:100px;`;
  else style += ` display:inline-block;`;
  return style;
}

function makeSvgStyle(w, h) {
  const c = getColor();
  const bg = getBg();
  const pos = getPos();
  let style = `width:${w}px; height:${h}px; color:${c};`;
  if (bg !== 'transparent') style += ` background:${bg}; padding:4px; border-radius:4px;`;
  if (pos === 'absolute') style += ` position:absolute; left:100px; top:100px;`;
  else style += ` display:inline-block;`;
  return style;
}

// --- Build buttons ---
function addCharBtn(containerId, char, label) {
  const grid = document.getElementById(containerId);
  const btn = document.createElement('div');
  btn.className = 'btn';
  btn.innerHTML = `<span class="icon">${char}</span><span class="lbl">${label}</span>`;
  btn.addEventListener('click', () => {
    const html = `<span style="${makeStyle()}">${char}</span>`;
    copyToClipboard(html, btn);
  });
  grid.appendChild(btn);
}

function addSvgBtn(containerId, svgContent, viewBox, label, wide) {
  const grid = document.getElementById(containerId);
  const btn = document.createElement('div');
  btn.className = 'btn' + (wide ? ' wide' : '');
  btn.innerHTML = `<svg viewBox="${viewBox}" style="color:currentColor">${svgContent}</svg><span class="lbl">${label}</span>`;
  btn.addEventListener('click', () => {
    const s = getSize();
    const ratio = viewBox.split(' ');
    const vw = parseFloat(ratio[2]);
    const vh = parseFloat(ratio[3]);
    const w = s;
    const h = Math.round(s * (vh / vw));
    const html = `<svg viewBox="${viewBox}" style="${makeSvgStyle(w, h)}">${svgContent}</svg>`;
    copyToClipboard(html, btn);
  });
  grid.appendChild(btn);
}

function addBlockBtn(containerId, label, htmlTemplate) {
  const grid = document.getElementById(containerId);
  const btn = document.createElement('div');
  btn.className = 'btn wide';
  btn.innerHTML = `<span class="icon" style="font-size:16px">${label}</span>`;
  btn.addEventListener('click', () => {
    const c = getColor();
    const bg = getBg();
    const html = htmlTemplate.replace(/\{color\}/g, c).replace(/\{bg\}/g, bg === 'transparent' ? '#f0f0f0' : bg);
    copyToClipboard(html, btn);
  });
  grid.appendChild(btn);
}

// ===== SHAPES FILLED =====
addSvgBtn('shapes-filled', '<rect x="1" y="1" width="28" height="28" fill="currentColor" rx="2"/>', '0 0 30 30', 'Square');
addSvgBtn('shapes-filled', '<rect x="1" y="1" width="38" height="22" fill="currentColor" rx="2"/>', '0 0 40 24', 'Rectangle');
addSvgBtn('shapes-filled', '<circle cx="15" cy="15" r="14" fill="currentColor"/>', '0 0 30 30', 'Circle');
addSvgBtn('shapes-filled', '<ellipse cx="20" cy="12" rx="19" ry="11" fill="currentColor"/>', '0 0 40 24', 'Oval');
addSvgBtn('shapes-filled', '<polygon points="15,1 29,29 1,29" fill="currentColor"/>', '0 0 30 30', 'Triangle');
addSvgBtn('shapes-filled', '<polygon points="15,1 29,15 15,29 1,15" fill="currentColor"/>', '0 0 30 30', 'Diamond');
addSvgBtn('shapes-filled', '<polygon points="15,1 29,11 24,29 6,29 1,11" fill="currentColor"/>', '0 0 30 30', 'Pentagon');
addSvgBtn('shapes-filled', '<polygon points="8,1 22,1 29,15 22,29 8,29 1,15" fill="currentColor"/>', '0 0 30 30', 'Hexagon');
addSvgBtn('shapes-filled', '<polygon points="15,1 18,11 29,11 20,17 24,28 15,21 6,28 10,17 1,11 12,11" fill="currentColor"/>', '0 0 30 30', 'Star');
addSvgBtn('shapes-filled', '<rect x="1" y="1" width="38" height="22" fill="currentColor" rx="11"/>', '0 0 40 24', 'Pill');

// ===== SHAPES OUTLINE =====
addSvgBtn('shapes-outline', '<rect x="2" y="2" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" rx="2"/>', '0 0 30 30', 'Square');
addSvgBtn('shapes-outline', '<rect x="2" y="2" width="36" height="20" fill="none" stroke="currentColor" stroke-width="2" rx="2"/>', '0 0 40 24', 'Rectangle');
addSvgBtn('shapes-outline', '<circle cx="15" cy="15" r="13" fill="none" stroke="currentColor" stroke-width="2"/>', '0 0 30 30', 'Circle');
addSvgBtn('shapes-outline', '<polygon points="15,2 28,28 2,28" fill="none" stroke="currentColor" stroke-width="2"/>', '0 0 30 30', 'Triangle');
addSvgBtn('shapes-outline', '<polygon points="15,2 28,15 15,28 2,15" fill="none" stroke="currentColor" stroke-width="2"/>', '0 0 30 30', 'Diamond');
addSvgBtn('shapes-outline', '<rect x="2" y="2" width="36" height="20" fill="none" stroke="currentColor" stroke-width="2" rx="10"/>', '0 0 40 24', 'Pill');
addSvgBtn('shapes-outline', '<polygon points="15,1 18,11 29,11 20,17 24,28 15,21 6,28 10,17 1,11 12,11" fill="none" stroke="currentColor" stroke-width="1.5"/>', '0 0 30 30', 'Star');

// ===== ARROWS =====
const arrowData = [
  ['→','Right'],['←','Left'],['↑','Up'],['↓','Down'],
  ['↔','Left-Right'],['↕','Up-Down'],['↗','Up-Right'],['↘','Down-Right'],
  ['↙','Down-Left'],['↖','Up-Left'],['➜','Bold Right'],['➤','Pointer'],
  ['▶','Play'],['◀','Back'],['▲','Up Tri'],['▼','Down Tri'],
  ['⤴','Curve Up'],['⤵','Curve Down'],['↩','Return'],['↪','Forward'],
  ['⟳','Rotate CW'],['⟲','Rotate CCW'],['⇒','Double Right'],['⇐','Double Left'],
];
arrowData.forEach(([ch, lbl]) => addCharBtn('arrows', ch, lbl));

// ===== ICONS =====
const iconData = [
  ['✓','Check'],['✗','X Mark'],['✕','Close'],['⚡','Lightning'],
  ['⚙','Gear'],['🔒','Lock'],['🔓','Unlock'],['👤','Person'],
  ['👥','People'],['📁','Folder'],['📄','File'],['💬','Chat'],
  ['🔔','Bell'],['🔍','Search'],['⭐','Star'],['❤','Heart'],
  ['⚠','Warning'],['❓','Question'],['📊','Chart'],['📈','Growth'],
  ['🎯','Target'],['💡','Idea'],['🏠','Home'],['✉','Mail'],
  ['☰','Menu'],['⋮','More'],['⊕','Add'],['⊖','Remove'],
  ['✏','Edit'],['🗑','Trash'],['⏱','Timer'],['🔗','Link'],
];
iconData.forEach(([ch, lbl]) => addCharBtn('icons', ch, lbl));

// ===== DOTS =====
const dotData = [
  ['●','Filled'],['○','Empty'],['◉','Bull'],['◎','Target'],
  ['◆','Diamond'],['◇','Diamond Empty'],['■','Square'],['□','Square Empty'],
  ['▪','Sm Square'],['▫','Sm Sq Empty'],['•','Bullet'],['◦','Open Bullet'],
  ['⬤','Big Circle'],['⬡','Hex Empty'],['⬢','Hex Fill'],
];
dotData.forEach(([ch, lbl]) => addCharBtn('dots', ch, lbl));

// ===== NUMBERS =====
const numData = [
  ['①','1'],['②','2'],['③','3'],['④','4'],['⑤','5'],
  ['⑥','6'],['⑦','7'],['⑧','8'],['⑨','9'],['⑩','10'],
  ['❶','1 Fill'],['❷','2 Fill'],['❸','3 Fill'],['❹','4 Fill'],['❺','5 Fill'],
];
numData.forEach(([ch, lbl]) => addCharBtn('numbers', ch, lbl));

// ===== BRACKETS =====
const bracketData = [
  ['「','Top-L'],['」','Top-R'],['『','Dbl Top-L'],['』','Dbl Top-R'],
  ['【','Bracket L'],['】','Bracket R'],['〈','Angle L'],['〉','Angle R'],
  ['⌜','Corner TL'],['⌝','Corner TR'],['⌞','Corner BL'],['⌟','Corner BR'],
  ['╔','Box TL'],['╗','Box TR'],['╚','Box BL'],['╝','Box BR'],
  ['═','Horiz Dbl'],['║','Vert Dbl'],['─','Horiz'],['│','Vert'],
];
bracketData.forEach(([ch, lbl]) => addCharBtn('brackets', ch, lbl));

// ===== LAYOUT =====
addBlockBtn('layout', '▬ Horiz Line', '<hr style="border:none; height:2px; background:{color}; width:200px; margin:8px 0;">');
addBlockBtn('layout', '┃ Vert Line', '<div style="width:2px; height:100px; background:{color}; display:inline-block;"></div>');
addBlockBtn('layout', '┅ Dashed Line', '<hr style="border:none; height:2px; background:transparent; border-top:2px dashed {color}; width:200px; margin:8px 0;">');
addBlockBtn('layout', '▭ Empty Box', '<div style="width:200px; height:120px; border:2px solid {color}; border-radius:6px;"></div>');
addBlockBtn('layout', '▭ Wide Box', '<div style="width:300px; height:50px; border:2px solid {color}; border-radius:6px;"></div>');
addBlockBtn('layout', '▭ Card', '<div style="width:200px; height:120px; border:1px solid {color}; border-radius:8px; overflow:hidden;"><div style="height:30px; border-bottom:1px solid {color}; background:{bg};"></div></div>');
addBlockBtn('layout', '⊡ Placeholder', '<div style="width:150px; height:100px; background:{bg}; border:2px dashed {color}; border-radius:6px; display:flex; align-items:center; justify-content:center; color:{color}; font-size:12px;">Placeholder</div>');
addBlockBtn('layout', '☐ Checkbox', '<div style="display:inline-flex; align-items:center; gap:6px;"><span style="width:18px; height:18px; border:2px solid {color}; border-radius:3px; display:inline-block;"></span><span style="color:{color}; font-size:14px;">Label</span></div>');
addBlockBtn('layout', '◉ Radio', '<div style="display:inline-flex; align-items:center; gap:6px;"><span style="width:18px; height:18px; border:2px solid {color}; border-radius:50%; display:inline-block;"></span><span style="color:{color}; font-size:14px;">Option</span></div>');
addBlockBtn('layout', '▤ Input Field', '<div style="width:200px; height:36px; border:1px solid {color}; border-radius:4px; background:#fff; padding:6px 10px; color:#999; font-size:13px;">Type here...</div>');

// ===== COMMON HTML BLOCKS =====
addBlockBtn('blocks', 'H1 Header', '<h1 style="color:{color}; font-size:32px; margin:0;">Heading</h1>');
addBlockBtn('blocks', 'H2 Subhead', '<h2 style="color:{color}; font-size:24px; margin:0;">Subheading</h2>');
addBlockBtn('blocks', 'Paragraph', '<p style="color:{color}; font-size:14px; margin:0;">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>');
addBlockBtn('blocks', 'Button', '<button style="background:{color}; color:#fff; border:none; padding:10px 24px; border-radius:6px; font-size:14px; cursor:pointer;">Button</button>');
addBlockBtn('blocks', 'Outline Btn', '<button style="background:transparent; color:{color}; border:2px solid {color}; padding:10px 24px; border-radius:6px; font-size:14px; cursor:pointer;">Button</button>');
addBlockBtn('blocks', 'Badge', '<span style="background:{color}; color:#fff; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:bold;">Badge</span>');
addBlockBtn('blocks', 'Avatar Circle', '<div style="width:48px; height:48px; border-radius:50%; background:{bg}; border:2px solid {color}; display:inline-flex; align-items:center; justify-content:center; font-size:20px; color:{color};">👤</div>');
addBlockBtn('blocks', 'Nav Bar', '<div style="display:flex; gap:20px; padding:10px 20px; background:{bg}; border-bottom:2px solid {color};"><span style="color:{color}; font-weight:bold;">Logo</span><span style="color:{color};">Home</span><span style="color:{color};">About</span><span style="color:{color};">Contact</span></div>');
addBlockBtn('blocks', 'Image Box', '<div style="width:150px; height:100px; background:{bg}; border:1px solid {color}; border-radius:4px; display:flex; align-items:center; justify-content:center; color:{color}; font-size:24px;">🖼</div>');
addBlockBtn('blocks', 'Spacer 20px', '<div style="height:20px;"></div>');
addBlockBtn('blocks', 'Spacer 40px', '<div style="height:40px;"></div>');
</script>
</body>
</html>
